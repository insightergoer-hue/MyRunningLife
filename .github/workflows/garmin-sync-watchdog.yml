name: Garmin sync watchdog (pre-reminder)

# 在 10:05 每日训练提醒之前，强制再拉一次 Garmin。
# 不依赖「检查是否过期」——直接同步，覆盖写同一天文件；无变化则不 commit。
# 解决 GitHub cron 延迟/丢失导致晨间数据缺失的复发问题。

on:
  schedule:
    # 北京 09:53 — 提醒前 12 分钟
    - cron: "53 1 * * *"
    # 北京 10:04 — 提醒前 1 分钟（硬保底）
    - cron: "4 2 * * *"
    # TEMP TEST 2026-08-31 — 北京 18:25 / 18:30（新 cron 需提前 ~10min 注册）
    - cron: "25 10 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  force-morning-sync:
    permissions:
      contents: write
    uses: ./.github/workflows/garmin-sync-reusable.yml
    with:
      mode: morning
    secrets: inherit
