name: Garmin daily sync

on:
  schedule:
    # 北京 09:07 / 09:26 / 09:52 / 10:00
    - cron: "7 1 * * *"
    - cron: "26 1 * * *"
    - cron: "52 1 * * *"
    - cron: "0 2 * * *"
    # 北京 12:13 上午兜底
    - cron: "13 4 * * *"
    # 北京 18:07 / 22:07 晚间补拉
    - cron: "7 10 * * *"
    - cron: "7 14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - yesterday
          - today
          - days
          - date
      days:
        description: "When mode=days: how many days through yesterday"
        required: false
        default: "3"
      date:
        description: "When mode=date: YYYY-MM-DD"
        required: false

jobs:
  sync:
    uses: ./.github/workflows/garmin-sync-reusable.yml
    with:
      mode: ${{ github.event.inputs.mode || 'morning' }}
      days: ${{ github.event.inputs.days || '3' }}
      date: ${{ github.event.inputs.date || '' }}
    secrets: inherit
